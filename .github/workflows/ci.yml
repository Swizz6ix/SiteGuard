name: SiteGuard CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm type-check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke test
        run: |
          pnpm siteguard --version
          pnpm siteguard --help
          pnpm siteguard health --json
